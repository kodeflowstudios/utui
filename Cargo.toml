[package]
name = "utui"
version = "1.0.6"
edition = "2024"

[dependencies]
color-eyre = "0.6.3"
crossterm = "0.29.0"
ratatui = { version = "0.30.2", features = ["all-widgets"] }
chrono = "0.4.38"
chrono-tz = "0.10.0"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.132"
strum = "0.28.0"
strum_macros = "0.28.0"
rust-fuzzy-search = "0.1.1"
textwrap = "0.16.2"
unicode-width = "0.1"
arboard = "3.6.1"
rayon = "1.12.0"

